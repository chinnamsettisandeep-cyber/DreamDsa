<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food App Demo</title>
  <style>
    body{margin:0;font-family:sans-serif;background:#f9f5f1;color:#333}
    header{padding:2rem 1rem;text-align:center;background:#e6360e;color:#ffffff}
    .card{margin:1rem auto;padding:1rem;border-radius:16px;background:#fff;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .food{display:grid;grid-template-columns:1fr 3fr;gap:1rem;align-items:center}
    .food img{width:100%;border-radius:12px}
    .food h3{margin:.25rem 0}
    .food p{margin:.5rem 0;color:#666}
    .button{display:inline-block;margin-top:.75rem;padding:.75rem 1.2rem;background:#ff7b5c;color:#fff;border-radius:999px;text-decoration:none}
  </style>
</head>
<body>
  <header>
    <h1>Foodie Demo</h1>
    <p>Quick food app preview with favorites and order details.</p>
  </header>

  <section class="card food">
    <img src="https://images.unsplash.com/photo-1499028344343-cd173ffc68a9?auto=format&fit=crop&w=400&q=80" alt="Sushi">
    <div>
      <h3>Sushi Bowl</h3>
      <p>Fresh salmon, rice, avocado, and sesame dressing.</p>
      <div class="button">Order Now</div>
    </div>
  </section>

  <section class="card food">
    <img src="c:\Users\chinn\Downloads\Pizza-3007395.jpg" alt="Pizza">
    <div>
      <h3>Margherita Pizza</h3>
      <p>Classic tomato, mozzarella, basil, and crispy crust.</p>
      <div class="button">Add to Cart</div>
    </div>
  </section>
</body>
</html>
